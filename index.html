<style>

    background: #000; border: 2px solid #4a5290; border-radius: 0;

  input:focus { outline: none; border-color: #f8d038; }

  #msg.err { color: #ffb0a0; }
  button {
    display: block; min-height: 48px; margin: 4px auto 0; padding: 0 1em;
    font: inherit; color: #f8f8f8; background: none; border: 0; cursor: pointer;
  }
  button::before { content: "▶ "; animation: blink 1s steps(1) infinite; }
  button:hover, button:focus-visible { color: #f8d038; outline: none; }
  button:disabled { color: #606480; }
  button:disabled::before { animation: none; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { button::before { animation: none; } }

<script>
(() => {
  "use strict";
  const KEY = "papa-birthday-pass";
  const P = JSON.parse(document.getElementById("payload").textContent);
  const form = document.getElementById("lock");
  const input = document.getElementById("pass");
  const msg = document.getElementById("msg");
  const btn = form.querySelector("button");
  const bytes = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const norm = (s) => s.normalize("NFKC").toLowerCase().replace(/\s+/g, "");
  const say = (text, err) => { msg.textContent = text; msg.className = err ? "err" : ""; };

  async function unseal(pass) {
    const subtle = window.crypto.subtle;
    const base = await subtle.importKey("raw", new TextEncoder().encode(norm(pass)), "PBKDF2", false, ["deriveKey"]);
    const key = await subtle.deriveKey(
      { name: "PBKDF2", salt: bytes(P.s), iterations: P.n, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plain = await subtle.decrypt({ name: "AES-GCM", iv: bytes(P.i) }, key, bytes(P.d));
    return new TextDecoder().decode(plain);
  }

  function start(html) {
    document.open();
    document.write(html);
    document.close();
  }

  if (!window.crypto || !window.crypto.subtle) {
    say("このブラウザでは ひらけません。", true);
    btn.disabled = true;
    return;
  }

  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const pass = input.value;
    if (!norm(pass)) { input.focus(); return; }
    btn.disabled = true;
    say("しらべています……");
    let html;
    try {
      html = await unseal(pass);
    } catch (e) {
      say("あいことばが ちがうようだ。", true);
      btn.disabled = false;
      input.select();
      return;
    }
    try { localStorage.setItem(KEY, pass); } catch (e) { /* private mode: fine */ }
    start(html);
  });

  // Already unlocked on this device: open straight away.
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* ignore */ }
  if (saved) {
    btn.disabled = true;
    say("ひらいています……");
    unseal(saved).then(start, () => {
      try { localStorage.removeItem(KEY); } catch (e) { /* ignore */ }
      btn.disabled = false;
      say("");
    });
  }
})();
</script>
